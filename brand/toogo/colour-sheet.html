.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:#fff;border-radius:18px;padding:22px;}

.ic{display:flex;flex-direction:column;align-items:center;gap:6px} .ic small{font-size:11px;color:#8a817a}
.big svg{width:96px;height:96px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15));border-radius:22px}
.mid svg{width:48px;height:48px} .sm svg{width:16px;height:16px} .sym svg{width:72px;height:72px}
