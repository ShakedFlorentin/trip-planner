# Deploys one Supabase edge function from main. Runs only when started by hand (never on a push),
# so a function goes live only when the owner has said yes. Needs the repo secret SUPABASE_ACCESS_TOKEN.
name: Deploy edge function

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        required: true
        type: choice
        options:
          - plan-trip

permissions:
  contents: read

concurrency:
  group: deploy-function-${{ inputs.function }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PROJECT_REF: wbofjfwbdewgnwjmcpnv
      FUNCTION: ${{ inputs.function }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      # plan-trip checks the planner token or trip membership itself, so the gateway JWT check stays off (as it is live)
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
