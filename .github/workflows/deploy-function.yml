# Deploys one Supabase edge function from main. Runs only when started by hand (never on a push),
# so a function goes live only when the owner has said yes. Needs the repo secret SUPABASE_ACCESS_TOKEN.
name: Deploy edge function

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        required: true
        type: choice
        options:
          - plan-trip
          - suggest-place
          - card-photos
          - card-facts
          - parse-booking

permissions:
  contents: read

concurrency:
  group: deploy-function-${{ inputs.function }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      PROJECT_REF: wbofjfwbdewgnwjmcpnv
      FUNCTION: ${{ inputs.function }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      # The gateway JWT flag, per function:
      #  - plan-trip, suggest-place: check the planner token / the signed-in user and trip membership themselves (the browser's
      #    preflight carries no JWT), so the gateway check is off.
      #  - card-photos, card-facts: called by database triggers through pg_net with the planner token (x-plan-token) and no user
      #    JWT, and check that token themselves, so the gateway check is off.
      #  - parse-booking: the app calls it with the member's session JWT and the function runs getUser() on it, so the gateway
      #    check stays ON (no flag). Before the first deploy of any of these, look at the function's live verify_jwt setting:
      #    this step sets it to what is written here.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          case "$FUNCTION" in
            plan-trip|card-photos|card-facts) JWT_FLAG="--no-verify-jwt" ;;
            parse-booking|suggest-place) JWT_FLAG="--verify-jwt" ;;
            *) echo "unknown function: $FUNCTION"; exit 1 ;;
          esac
          supabase functions deploy "$FUNCTION" --project-ref "$PROJECT_REF" $JWT_FLAG --use-api --yes
